# CrimeGPT dev stack: Django web + Postgres (with pgvector).
# The frontend runs separately via Vite (cd frontend && npm run dev) per the plan.

services:
  db:
    # Official pgvector image = Postgres 16 with the vector extension available.
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-crimegpt}
      POSTGRES_USER: ${POSTGRES_USER:-crimegpt}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-crimegpt}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-crimegpt} -d ${POSTGRES_DB:-crimegpt}"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: ./backend
    # entrypoint waits for the DB and runs migrations; then this command starts.
    entrypoint: ["sh", "/app/entrypoint.sh"]
    command: ["python", "manage.py", "runserver", "0.0.0.0:8000"]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-crimegpt}
      POSTGRES_USER: ${POSTGRES_USER:-crimegpt}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-crimegpt}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-dev-insecure-change-me}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-1}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,0.0.0.0}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
    volumes:
      - ./backend:/app
      - media:/app/media
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  media:
